<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exemplo de Imagens em HTML</title>

</head>

<body>

    <h2>Imagens em Ação:</h2>
    <img src="natureza.jpg" alt="Uma paisagem exuberante com montanhas e um lago azul." width="400">
    <p>Esta é uma imagem de uma paisagem,</p>
    <img src="imagem-inexistente.gif" alt="Uma imagem de um gato fofo (não carregada)." width="250">
    <p>Se a imagem acima não carregar, você verá o texto alternativo "Uma imagem de um gato fofo (não carregada)".</p>
</body>

</html>
